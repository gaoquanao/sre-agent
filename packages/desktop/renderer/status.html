<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>SRE Agent</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #14171f;
        --border: #262b36;
        --text: #e6e9ef;
        --muted: #8b93a7;
        --accent: #4f8cff;
        --danger: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        padding: 32px;
      }
      .card {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px 32px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 10px 0 6px;
        font-size: 22px;
        font-weight: 600;
      }
      h1.failed {
        color: var(--danger);
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .spinner {
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        display: inline-block;
        vertical-align: -2px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .actions {
        display: flex;
        gap: 10px;
        margin: 18px 0 4px;
      }
      button {
        appearance: none;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border-color: var(--border);
        color: var(--text);
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      pre {
        margin: 16px 0 0;
        padding: 12px 14px;
        max-height: 240px;
        overflow: auto;
        background: #0d1017;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-all;
        color: #c6ccda;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">SRE Agent desktop</div>
      <h1 id="title"><span class="spinner"></span>Starting the backend…</h1>
      <p id="detail">Waiting for the server process to report readiness.</p>
      <p id="meta" class="meta"></p>
      <div class="actions">
        <button id="retry" hidden>Restart backend</button>
        <button id="open-data-dir" class="secondary">Open data folder</button>
      </div>
      <pre id="log">no log output yet</pre>
    </main>
    <script src="./status.js" type="module"></script>
  </body>
</html>
